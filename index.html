
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="container">

        <section class="calculadora">

            <header class="cabecalho">
                <div class="icone">＋</div>
                <span class="subtitulo">FERRAMENTA DE CÁLCULO</span>
                <h1>Calculadora</h1>
                <p>Simples, prática e fácil de usar.</p>
            </header>

            <div class="campo">
                <label for="numero1">Primeiro número</label>
                <input type="number" id="numero1" placeholder="Digite o primeiro número">
            </div>

            <div class="campo">
                <label for="operacao">Operação matemática</label>
                <select id="operacao">
                    <option value="soma">Adição (+)</option>
                    <option value="subtracao">Subtração (−)</option>
                    <option value="multiplicacao">Multiplicação (×)</option>
                    <option value="divisao">Divisão (÷)</option>
                </select>
            </div>

            <div class="campo">
                <label for="numero2">Segundo número</label>
                <input type="number" id="numero2" placeholder="Digite o segundo número">
            </div>

            <div class="botoes">
                <button class="calcular" onclick="calcular()">
                    Calcular
                </button>

                <button class="limpar" onclick="limpar()">
                    Limpar
                </button>
            </div>

            <div class="extras">
                <button onclick="porcentagem()">Porcentagem (%)</button>
                <button onclick="adicionarVirgula()">Adicionar vírgula (,)</button>
            </div>

            <div class="resultado-container">
                <span>RESULTADO</span>
                <p id="resultado">Seu resultado aparecerá aqui</p>
            </div>

            <footer>
                Calculadora digital
            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
