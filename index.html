
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Multifuncional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculadora">
        <h1>Calculadora</h1>

        <input type="number" id="numero1" placeholder="Primeiro número">

        <select id="operacao">
            <option value="soma">Soma (+)</option>
            <option value="subtracao">Subtração (-)</option>
            <option value="multiplicacao">Multiplicação (×)</option>
            <option value="divisao">Divisão (÷)</option>
        </select>

        <input type="number" id="numero2" placeholder="Segundo número">

        <div class="botoes">
            <button onclick="limpar()">CE</button>
            <button onclick="porcentagem()">%</button>
            <button onclick="adicionarVirgula()">,</button>
            <button onclick="calcular()">=</button>
        </div>

        <p id="resultado">Resultado: </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
